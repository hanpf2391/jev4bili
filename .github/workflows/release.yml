name: Release

# 推 v* tag 自动出包并建 Release；也支持手动触发（不发 tag 也能先验一遍构建）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # 创建 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它默认要装早已从 SDK 仓库移除的
      # `tools` 包，会直接失败。ubuntu runner 镜像本来就预装了 Android SDK，
      # 直接用它并只补装我们需要的组件。
      - name: 安装 SDK 组件
        run: |
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          if [ -z "$SDKMGR" ]; then SDKMGR=$(command -v sdkmanager); fi
          if [ -z "$SDKMGR" ]; then echo "::error::找不到 sdkmanager"; exit 1; fi
          echo "使用 $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0"

      # keystore 以 base64 存在 Secret 里，避免二进制进仓库
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secret KEYSTORE_BASE64"; exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: 生成 keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::缺少 Secret $v"; exit 1; fi
          done
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 构建 release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain

      # 命名带上版本号，下载的人一眼知道是哪个版本
      - name: 重命名产物
        id: artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_NAME" = "$VERSION" ] && VERSION="$(date +%Y%m%d)-${GITHUB_SHA::7}"
          NAME="JEV4Bili-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la "$NAME"

      # 签名不对的包装不上，必须在发布前拦下；顺带把指纹带进 Release 说明
      - name: 校验签名
        id: sign
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          OUT=$("$APKSIGNER" verify --print-certs "${{ steps.artifact.outputs.name }}")
          echo "$OUT"
          FP=$(printf '%s' "$OUT" | grep -i 'certificate SHA-256 digest' | head -1 | awk '{print $NF}')
          if [ -z "$FP" ]; then echo "::error::未能取到签名指纹"; exit 1; fi
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"

      # 只在 tag 上发 Release；手动 dispatch 只跑构建，用来验证配置而不误发版
      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.name }}
          body: |
            ## JEV4Bili ${{ github.ref_name }}

            ### 安装

            1. 下载下面的 `${{ steps.artifact.outputs.name }}`
            2. 系统提示时允许「安装未知来源应用」
            3. 开启无障碍：设置 → 无障碍 → 已下载应用 → JEV4Bili
            4. 在 App 设置页填入你自己的 Jev API Key（不填则只做本地记录，不做 AI 判定）

            ### ⚠️ 装过 debug 版的人必读

            早期分发的包是 debug 签名（`CN=Android Debug`），正式版用的是独立发布密钥
            （`CN=JEV4Bili`）。**签名不同，Android 不允许覆盖安装**——装过旧版的话，
            请先卸载再装本版（本地判定记录会被清除）。

            ### 校验签名

            本产物的签名证书 SHA-256 指纹：

            ```
            ${{ steps.sign.outputs.fingerprint }}
            ```

            可用 `apksigner verify --print-certs ${{ steps.artifact.outputs.name }}` 自行核对。

            ---

            📖 官网 <https://hanpf2391.github.io/jev4bili/> · 源码 <https://github.com/hanpf2391/jev4bili>
          generate_release_notes: true

      # 把 APK 镜像到官网（GitHub Pages）：国内访问 github.com 不稳，但页面所在的
      # github.io 通常可达；落地页下载按钮指向本站直链 JEV4Bili-latest.apk
      - name: 镜像 APK 到官网
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p docs/releases
          cp "${{ steps.artifact.outputs.name }}" docs/releases/JEV4Bili-latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/releases/JEV4Bili-latest.apk
          git commit -m "chore: 官网镜像 APK ${{ github.ref_name }}"
          git pull --rebase origin main
          git push
