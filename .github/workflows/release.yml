name: Release

# 推 v* tag 自动出包并建 Release；也支持手动触发（不发 tag 也能先验一遍构建）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # 创建 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它默认要装早已从 SDK 仓库移除的
      # `tools` 包，会直接失败。ubuntu runner 镜像本来就预装了 Android SDK，
      # 直接用它并只补装我们需要的组件。
      - name: 安装 SDK 组件
        run: |
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          if [ -z "$SDKMGR" ]; then SDKMGR=$(command -v sdkmanager); fi
          if [ -z "$SDKMGR" ]; then echo "::error::找不到 sdkmanager"; exit 1; fi
          echo "使用 $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0"

      # keystore 以 base64 存在 Secret 里，避免二进制进仓库
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secret KEYSTORE_BASE64"; exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: 生成 keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::缺少 Secret $v"; exit 1; fi
          done
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 构建 release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain

      # 命名带上版本号，下载的人一眼知道是哪个版本
      - name: 重命名产物
        id: artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_NAME" = "$VERSION" ] && VERSION="$(date +%Y%m%d)-${GITHUB_SHA::7}"
          NAME="JEV4Bili-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la "$NAME"

      # 签名不对的包装不上，必须在发布前拦下
      - name: 校验签名
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "${{ steps.artifact.outputs.name }}"

      # 只在 tag 上发 Release；手动 dispatch 只跑构建，用来验证配置而不误发版
      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.name }}
          generate_release_notes: true
