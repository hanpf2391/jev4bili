<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>JEV4Bili · 常见问题</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1440px; height: 716px; overflow: hidden; background: #FFFFFF; }
  svg { display: block; }
  .hw    { font-family: "Zhi Mang Xing", "LXGW WenKai", "Yuanti SC", "Microsoft YaHei UI", sans-serif; }
  .title { font-family: "ZCOOL QingKe HuangYou", "Zhi Mang Xing", "Yuanti SC", sans-serif; }
  .ink { fill: #181D26; }  .muted { fill: #525C6B; }  .blue { fill: #1B61C9; }
  .s-ink  { stroke: #181D26; fill: none; }
  .s-blue { stroke: #1B61C9; fill: none; }
  .s-soft { stroke: #C9CED6; fill: none; }
</style>
</head>
<body>
<svg viewBox="0 0 1440 716" width="1440" height="716" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="sk" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="3" seed="11" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.8" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="sk2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.9" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- ═══════════════ 标题 ═══════════════ -->
  <text class="title ink" x="72" y="56" font-size="28">常见问题</text>
  <text class="hw muted" x="228" y="55" font-size="19">提 Issue 之前，先看这六条</text>
  <path class="s-soft" d="M72 78 H1368" stroke-width="2" stroke-dasharray="1 9" stroke-linecap="round" filter="url(#sk2)" />

  <!-- ═══════════════ ① 会被B站封号吗 ═══════════════ -->
  <g filter="url(#sk)">
    <rect x="72" y="104" width="628" height="186" rx="16" class="s-ink" stroke-width="3" />
    <path class="s-ink" stroke-width="3" stroke-linejoin="round"
          d="M108 128 L136 138 V162 C136 182 124 193 108 199 C92 193 80 182 80 162 V138 Z" />
    <path class="s-blue" d="M96 160 L105 170 L122 150" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text class="title ink" x="164" y="152" font-size="22">会被 B 站封号吗？</text>
  <text class="hw muted" x="164" y="190" font-size="18">不会。不调用 B 站任何接口、不修改客户端，也不</text>
  <text class="hw muted" x="164" y="218" font-size="18">注入进程，只是读屏幕上你本来就看得见的那几</text>
  <text class="hw muted" x="164" y="246" font-size="18">个字——和你看屏幕没什么区别。</text>

  <!-- ═══════════════ ② 要 root 吗 ═══════════════ -->
  <g filter="url(#sk)">
    <rect x="740" y="104" width="628" height="186" rx="16" class="s-ink" stroke-width="3" />
    <rect x="820" y="130" width="50" height="80" rx="10" class="s-ink" stroke-width="3" />
    <path class="s-ink" d="M833 146 H857" stroke-width="2.6" stroke-linecap="round" />
    <path class="s-blue" d="M833 180 V174 A9 9 0 0 1 851 174 V180" stroke-width="3" stroke-linecap="round" />
    <rect class="s-blue" x="828" y="180" width="28" height="20" rx="4" stroke-width="3" />
  </g>
  <text class="title ink" x="900" y="152" font-size="22">要 root 吗？要装 Xposed 吗？</text>
  <text class="hw muted" x="900" y="190" font-size="18">都不用。纯无障碍方案，装完开一个无障碍开关</text>
  <text class="hw muted" x="900" y="218" font-size="18">就能用——不破解、不改机、不动系统，也不要</text>
  <text class="hw muted" x="900" y="246" font-size="18">任何特殊权限；关掉开关就彻底停下。</text>

  <!-- ═══════════════ ③ 能看到我的隐私吗 ═══════════════ -->
  <g filter="url(#sk)">
    <rect x="72" y="308" width="628" height="186" rx="16" class="s-ink" stroke-width="3" />
    <path class="s-ink" stroke-width="3" stroke-linejoin="round"
          d="M80 400 C94 378 122 378 136 400 C122 422 94 422 80 400 Z" />
    <circle cx="108" cy="400" r="9" class="s-ink" stroke-width="3" />
    <path class="s-blue" d="M80 428 L136 372" stroke-width="3.6" stroke-linecap="round" />
  </g>
  <text class="title ink" x="164" y="356" font-size="22">它能看到我的隐私吗？</text>
  <text class="hw muted" x="164" y="394" font-size="18">看不到。不截图、不读视频内容，只拿卡片上</text>
  <text class="hw muted" x="164" y="422" font-size="18">那几个字；零遥测、零第三方 SDK，代码全摆</text>
  <text class="hw muted" x="164" y="450" font-size="18">在 GitHub 上，随你查。</text>

  <!-- ═══════════════ ④ 费电吗 ═══════════════ -->
  <g filter="url(#sk)">
    <rect x="740" y="308" width="628" height="186" rx="16" class="s-ink" stroke-width="3" />
    <rect x="824" y="382" width="64" height="34" rx="7" class="s-ink" stroke-width="3" />
    <path class="s-ink" d="M890 392 V406" stroke-width="5" stroke-linecap="round" />
    <rect x="830" y="388" width="34" height="22" rx="4" fill="#1B61C9" opacity="0.72" />
  </g>
  <text class="title ink" x="900" y="356" font-size="22">费电吗？</text>
  <text class="hw muted" x="900" y="394" font-size="18">约 1.8%/时，只在你刷 B 站的时候工作。</text>
  <text class="hw muted" x="900" y="422" font-size="18">主页「后台耗电」那一栏就是它自己报的数；</text>
  <text class="hw muted" x="900" y="450" font-size="18">不放心的话，把守护暂停掉就一点都不耗了。</text>

  <!-- ═══════════════ ⑤ 判不准怎么办 ═══════════════ -->
  <g filter="url(#sk)">
    <rect x="72" y="512" width="628" height="186" rx="16" class="s-ink" stroke-width="3" />
    <path class="s-ink" d="M80 606 H136" stroke-width="3.4" stroke-linecap="round" />
    <circle cx="116" cy="606" r="10" class="s-blue" stroke-width="3.4" />
  </g>
  <text class="title ink" x="164" y="560" font-size="22">判不准怎么办？</text>
  <text class="hw muted" x="164" y="598" font-size="18">两个旋钮：「判定灵敏度」滑杆往右更严；单个</text>
  <text class="hw muted" x="164" y="626" font-size="18">UP 主可加白名单／黑名单。同一 UP 主的判定</text>
  <text class="hw muted" x="164" y="654" font-size="18">会累积成本地画像，越用越准。</text>

  <!-- ═══════════════ ⑥ 要花钱吗 ═══════════════ -->
  <g filter="url(#sk)">
    <rect x="740" y="512" width="628" height="186" rx="16" class="s-ink" stroke-width="3" />
    <circle cx="852" cy="606" r="26" class="s-ink" stroke-width="3.2" />
    <path class="s-blue" d="M842 592 L852 604 L862 592 M845 606 H859 M845 616 H859 M852 604 V622"
          stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text class="title ink" x="900" y="560" font-size="22">要花钱吗？</text>
  <text class="hw muted" x="900" y="598" font-size="18">App 本身免费开源（GPL-3.0）。判定用的是你</text>
  <text class="hw muted" x="900" y="626" font-size="18">自己的 Jev 密钥，费用直接付给接口方，</text>
  <text class="hw muted" x="900" y="654" font-size="18">作者不经手、也看不到你的内容。</text>

</svg>
</body>
</html>
