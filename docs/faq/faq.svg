<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720">
<defs><style>
  text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
  .title { font-size: 30px; font-weight: 700; fill: #111827; }
  .subtitle { font-size: 14px; font-weight: 500; fill: #5f6875; }
  .q { font-size: 17px; font-weight: 700; fill: #111827; }
  .a { font-size: 14px; font-weight: 500; fill: #5f6875; }
  .num { font-size: 11px; font-weight: 800; fill: #5f6875; letter-spacing: 0.08em; }
</style></defs>
<rect width="1240" height="720" fill="#ffffff"/>
<text class="title" x="40" y="58">常见问题</text>
<text class="subtitle" x="40" y="86">看 README 之前，先看这六条</text>
<path d="M40 112 H1200" stroke="#dbe5f1" stroke-width="1.4" stroke-dasharray="6 5" fill="none"/>
<g>
  <rect x="40" y="134" width="560" height="156" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.4"/>
  <rect x="66" y="160" width="44" height="44" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4"/>
  <g transform="translate(76,170)" fill="none" stroke="#1B61C9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 L20 6 V12 C20 16.5 16.5 19.8 12 21 C7.5 19.8 4 16.5 4 12 V6 Z"/><path d="M8.5 12 L11 14.5 L15.5 10"/></g>
  <text class="num" x="574" y="168" text-anchor="end">01</text>
  <text class="q" x="126" y="182">会被 B 站封号吗？</text>
  <text class="a" x="126" y="220">不会。不调用 B 站任何接口、不修改客户端，也不注入进程，</text>
  <text class="a" x="126" y="245">只是读屏幕上你本来就看得见的那几个字——和你看屏幕没什么区别。</text>
</g>
<g>
  <rect x="640" y="134" width="560" height="156" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.4"/>
  <rect x="666" y="160" width="44" height="44" rx="11" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.4"/>
  <g transform="translate(676,170)" fill="none" stroke="#16a34a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5.0" y="11.0" width="14.0" height="9.0" rx="2" ry="2"/><path d="M8 11 V8 C8 5.8 9.8 4 12 4 C13.6 4 15 4.9 15.7 6.2"/><circle cx="12.0" cy="15.6" r="1.6"/></g>
  <text class="num" x="1174" y="168" text-anchor="end">02</text>
  <text class="q" x="726" y="182">要 root 吗？要装 Xposed 吗？</text>
  <text class="a" x="726" y="220">都不用。纯无障碍方案，装完开一个无障碍开关就能用——不破解、</text>
  <text class="a" x="726" y="245">不改机、不动系统，也不要任何特殊权限；关掉开关就彻底停下。</text>
</g>
<g>
  <rect x="40" y="314" width="560" height="156" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.4"/>
  <rect x="66" y="340" width="44" height="44" rx="11" fill="#faf5ff" stroke="#ede9fe" stroke-width="1.4"/>
  <g transform="translate(76,350)" fill="none" stroke="#7c3aed" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12 C5 7 8.5 5 12 5 C15.5 5 19 7 22 12 C19 17 15.5 19 12 19 C8.5 19 5 17 2 12 Z"/><circle cx="12.0" cy="12.0" r="3.0"/><path d="M4.5 19.5 L19.5 4.5"/></g>
  <text class="num" x="574" y="348" text-anchor="end">03</text>
  <text class="q" x="126" y="362">它能看到我的隐私吗？</text>
  <text class="a" x="126" y="400">看不到。不截图、不读视频内容，只拿卡片上那几个字；零遥测、</text>
  <text class="a" x="126" y="425">零第三方 SDK，代码全摆在 GitHub 上，随你查。</text>
</g>
<g>
  <rect x="640" y="314" width="560" height="156" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.4"/>
  <rect x="666" y="340" width="44" height="44" rx="11" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.4"/>
  <g transform="translate(676,350)" fill="none" stroke="#f97316" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.0" y="7.0" width="16.0" height="10.0" rx="2" ry="2"/><rect x="20.4" y="10.4" width="-18.4" height="-7.2" rx="2" ry="2"/><rect x="5.6" y="9.6" width="2.4000000000000004" height="-4.8" rx="1" fill="#f97316" stroke="none"/></g>
  <text class="num" x="1174" y="348" text-anchor="end">04</text>
  <text class="q" x="726" y="362">费电吗？</text>
  <text class="a" x="726" y="400">约 1.8%/时，只在你刷 B 站的时候工作。主页「后台耗电」那一栏就是</text>
  <text class="a" x="726" y="425">它自己报的数；不放心的话，把守护暂停掉就一点都不耗了。</text>
</g>
<g>
  <rect x="40" y="494" width="560" height="156" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.4"/>
  <rect x="66" y="520" width="44" height="44" rx="11" fill="#fef2f2" stroke="#fee2e2" stroke-width="1.4"/>
  <g transform="translate(76,530)" fill="none" stroke="#dc2626" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7 H20"/><path d="M4 12 H20"/><path d="M4 17 H20"/><circle cx="9.0" cy="7.0" r="2.4" fill="#dc2626" stroke="none"/><circle cx="15.4" cy="12.0" r="2.4" fill="#dc2626" stroke="none"/><circle cx="7.0" cy="17.0" r="2.4" fill="#dc2626" stroke="none"/></g>
  <text class="num" x="574" y="528" text-anchor="end">05</text>
  <text class="q" x="126" y="542">判不准怎么办？</text>
  <text class="a" x="126" y="580">两个旋钮：「判定灵敏度」滑杆往右更严；单个 UP 主可加</text>
  <text class="a" x="126" y="605">白名单／黑名单。同一 UP 主的判定会累积成本地画像，越用越准。</text>
</g>
<g>
  <rect x="640" y="494" width="560" height="156" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.4"/>
  <rect x="666" y="520" width="44" height="44" rx="11" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1.4"/>
  <g transform="translate(676,530)" fill="none" stroke="#0d9488" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12.0" cy="12.0" r="8.6"/><path d="M9 8.4 L12 12.4 M15 8.4 L12 12.4 M9.4 13 H14.6 M9.4 15.6 H14.6 M12 12.4 V17.2"/></g>
  <text class="num" x="1174" y="528" text-anchor="end">06</text>
  <text class="q" x="726" y="542">要花钱吗？</text>
  <text class="a" x="726" y="580">App 本身免费开源（GPL-3.0）。判定用的是你自己的 Jev 密钥，费用</text>
  <text class="a" x="726" y="605">直接付给接口方，作者不经手、也看不到你的内容。</text>
</g>
<text class="subtitle" x="40" y="694">纯无障碍方案 · 不 root · 不调用 B 站任何接口 · 零遥测 · GPL-3.0</text>
</svg>