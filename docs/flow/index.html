  <path id="flow-head-verdict" class="hf-flow" d="M 840,174 L 1030,174 L 1030,340" fill="none" stroke="#ede9fe" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0" stroke-dasharray="6 35"/>
  <path id="flow-body-build-profile" class="hf-flow" d="M 740,208 L 740,480" fill="none" stroke="#6ee7b7" stroke-width="3.84" stroke-linecap="round" stroke-linejoin="round" opacity="0" stroke-dasharray="16 25"/>
  <path id="flow-head-build-profile" class="hf-flow" d="M 740,208 L 740,480" fill="none" stroke="#d1fae5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0" stroke-dasharray="6 35"/>
  <path id="flow-body-log-local" class="hf-flow" d="M 1030,408 L 1030,480" fill="none" stroke="#6ee7b7" stroke-width="3.84" stroke-linecap="round" stroke-linejoin="round" opacity="0" stroke-dasharray="16 25"/>
  <path id="flow-head-log-local" class="hf-flow" d="M 1030,408 L 1030,480" fill="none" stroke="#d1fae5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0" stroke-dasharray="6 35"/>
      </svg>
    </div>

    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        var EDGES = [{ id: "read-screen", marker: "url(#arrowC)", stage: 1 },
          { id: "send-text", marker: "url(#arrowE)", stage: 2 },
          { id: "verdict", marker: "url(#arrowA)", stage: 3 },
          { id: "build-profile", marker: "url(#arrowB)", stage: 4 },
          { id: "log-local", marker: "url(#arrowB)", stage: 5 }];

        /* 箭头标签：SVG 里是独立的 text，按文档顺序与边一一对应。
           契约要求标签随各自连线一起出现，不能一开始就全亮着。 */
        var LABELS = gsap.utils.toArray("#root .arrow-label");
        gsap.set(LABELS, { opacity: 0 });

        /* 描线：用实测长度设 dash，配合 marker-end 在画完的瞬间才挂上，
           否则箭头头部会从第一帧就悬在终点。 */
        EDGES.forEach(function (e, i) {
          var el = document.getElementById(e.id);
          if (!el) return;
          var len = el.getTotalLength();
          el.style.strokeDasharray = len + " " + len;
          el.style.strokeDashoffset = len;
          el.style.markerEnd = "none";

          var at = 0.05 + i * 0.35;
          tl.to(el, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, at);
          // 线画到终点，箭头头部才落上
          tl.set(el, { attr: { "marker-end": e.marker } }, at + 0.35 - 0.02);
          // 标签与连线同时落位
          if (LABELS[i]) tl.to(LABELS[i], { opacity: 1, duration: 0.15, ease: "power1.out" }, at + 0.35);

          // 流光：描线完成后淡入，沿箭头持续前进
          var body = document.getElementById("flow-body-" + e.id);
          var head = document.getElementById("flow-head-" + e.id);
          if (body) {
            tl.to(body, { opacity: 0.9, duration: 0.15, ease: "power1.out" }, 1.8);
            tl.fromTo(body,
              { strokeDashoffset: 0 },
              { strokeDashoffset: -444.0, duration: 3.7, ease: "none" },
              1.8);
          }
          if (head) {
            tl.to(head, { opacity: 1, duration: 0.15, ease: "power1.out" }, 1.8);
            tl.fromTo(head,
              { strokeDashoffset: -10 },
              { strokeDashoffset: -454.0, duration: 3.7, ease: "none" },
              1.8);
          }
        });

        /* 复位：末端把连线与流光一起淡出，让循环回到第 0 帧的「无连线」状态。
           节点、文字、容器全程不动——这是 fireworks 自己的运动契约。 */
        var fadeOut = gsap.utils.toArray("#root .hf-flow");
        EDGES.forEach(function (e) {
          var el = document.getElementById(e.id);
          if (el) fadeOut.push(el);
        });
        gsap.utils.toArray("#root .arrow-label").forEach(function (l) { fadeOut.push(l); });
        tl.to(fadeOut, { opacity: 0, duration: 0.25, ease: "none" }, 5.5);

        window.__timelines["flow"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
